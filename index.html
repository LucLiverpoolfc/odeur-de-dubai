<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO Meta Tags -->
    <meta name="description" content="Odeur de Dubaï — L'essence authentique de Dubaï. Découvrez une collection exclusive de haute parfumerie alliant l'or, l'oud et l'excellence.">
    <meta name="keywords" content="parfum, luxe, Dubaï, oud, haute parfumerie, fragrance, collection exclusive">
    <meta name="author" content="Odeur de Dubaï">
    <meta name="theme-color" content="#1a0e04">

    <!-- Open Graph -->
    <meta property="og:title" content="Odeur de Dubaï | Haute Parfumerie">
    <meta property="og:description" content="L'or, l'oud et l'excellence réunis dans des créations d'exception.">
    <meta property="og:type" content="website">

    <title>Odeur de Dubaï | Haute Parfumerie de Luxe</title>

    <!-- Google Fonts: Cormorant Garamond (Serif élégant) + Montserrat (Sans-serif épuré) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Montserrat:wght@200;300;400;500;600&display=swap" rel="stylesheet">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Tailwind Custom Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'serif-luxury': ['"Cormorant Garamond"', 'Georgia', 'serif'],
                        'sans-luxury': ['"Montserrat"', 'system-ui', 'sans-serif'],
                    },
                    colors: {
                        gold: {
                            50:  '#fdf9f0',
                            100: '#f8ecd4',
                            200: '#f0d6a4',
                            300: '#e5bc6e',
                            400: '#d4a44a',
                            500: '#c5a055',
                            600: '#b08a3e',
                            700: '#946e30',
                            800: '#7a5a2c',
                            900: '#654a27',
                        },
                        desert: {
                            dark:    '#1a0e04',
                            deep:    '#2c1a08',
                            warm:    '#3d2810',
                            sand:    '#c2a57b',
                            light:   '#e8d5b7',
                            sunrise: '#e67e22',
                        },
                    },
                    letterSpacing: {
                        'ultra-wide': '0.25em',
                        'luxe':       '0.15em',
                    },
                    animation: {
                        'fade-in-up':       'fadeInUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'fade-in-up-delay': 'fadeInUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards',
                        'fade-in-up-delay2':'fadeInUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.6s forwards',
                        'fade-in-up-delay3':'fadeInUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.9s forwards',
                        'shimmer':          'shimmer 3s ease-in-out infinite',
                        'pulse-glow':       'pulseGlow 4s ease-in-out infinite',
                        'header-fade':      'headerFade 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'wiggle':           'wiggle 0.5s ease-in-out',
                    },
                    keyframes: {
                        fadeInUp: {
                            '0%':   { opacity: '0', transform: 'translateY(40px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        shimmer: {
                            '0%, 100%': { opacity: '0.7' },
                            '50%':     { opacity: '1' },
                        },
                        pulseGlow: {
                            '0%, 100%': { boxShadow: '0 0 20px rgba(197, 160, 85, 0.0)' },
                            '50%':     { boxShadow: '0 0 35px rgba(197, 160, 85, 0.15)' },
                        },
                        headerFade: {
                            '0%':   { opacity: '0', transform: 'translateY(-10px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        wiggle: {
                            '0%, 100%': { transform: 'rotate(0deg)' },
                            '20%':     { transform: 'rotate(-6deg)' },
                            '40%':     { transform: 'rotate(5deg)' },
                            '60%':     { transform: 'rotate(-3deg)' },
                            '80%':     { transform: 'rotate(2deg)' },
                        },
                    },
                },
            },
        }
    </script>

    <!-- Custom Styles (au-delà de Tailwind) -->
    <style>
        /* ── Smooth scroll & base ──────────────────────────── */
        html {
            scroll-behavior: smooth;
        }

        /* ── Initial hidden state for animated elements ───── */
        .anim-hidden {
            opacity: 0;
        }

        /* ── Gold text gradient for the main heading ──────── */
        .text-gold-gradient {
            background: linear-gradient(
                135deg,
                #f8ecd4 0%,
                #d4a44a 30%,
                #e5bc6e 50%,
                #d4a44a 70%,
                #f8ecd4 100%
            );
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* ── Subtle decorative gold line ──────────────────── */
        .gold-line {
            width: 60px;
            height: 1px;
            background: linear-gradient(
                90deg,
                transparent,
                #d4a44a,
                transparent
            );
        }

        /* ── CTA Button — Elegant fill-on-hover effect ───── */
        .cta-luxury {
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(212, 164, 74, 0.6);
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .cta-luxury::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(212, 164, 74, 0.08),
                rgba(212, 164, 74, 0.15),
                rgba(212, 164, 74, 0.08),
                transparent
            );
            transition: left 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .cta-luxury:hover::before {
            left: 100%;
        }

        .cta-luxury:hover {
            border-color: rgba(212, 164, 74, 0.9);
            background-color: rgba(212, 164, 74, 0.1);
            box-shadow:
                0 0 30px rgba(212, 164, 74, 0.12),
                inset 0 0 30px rgba(212, 164, 74, 0.05);
            transform: translateY(-2px);
            letter-spacing: 0.3em;
        }

        /* ── Cursor personnalisé au survol du CTA ─────────── */
        .cta-luxury:hover {
            cursor: pointer;
        }

        /* ── Overlay gradient chaud sur l'image de fond ───── */
        .hero-overlay {
            background: linear-gradient(
                180deg,
                rgba(26, 14, 4, 0.75) 0%,
                rgba(26, 14, 4, 0.40) 35%,
                rgba(26, 14, 4, 0.20) 55%,
                rgba(26, 14, 4, 0.50) 80%,
                rgba(26, 14, 4, 0.85) 100%
            );
        }

        /* ── Fine gold separator ─────────────────────────── */
        .separator-gold {
            width: 80px;
            height: 1px;
            background: linear-gradient(
                90deg,
                transparent 0%,
                #d4a44a 50%,
                transparent 100%
            );
        }

        /* ── Floating particles (decorative) ──────────────── */
        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: rgba(212, 164, 74, 0.4);
            border-radius: 50%;
            animation: floatParticle linear infinite;
        }

        @keyframes floatParticle {
            0% {
                transform: translateY(0) translateX(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) translateX(20px);
                opacity: 0;
            }
        }

        /* ── Logo text gold gradient ──────────────────────── */
        .logo-gold-gradient {
            background: linear-gradient(
                180deg,
                #f8ecd4 0%,
                #d4a44a 40%,
                #c5a055 70%,
                #e5bc6e 100%
            );
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* ── Header entrance animation (initial state) ────── */
        .header-init {
            opacity: 0;
            transform: translateY(-10px);
        }

        /* ── Phone icon wiggle on hover ───────────────────── */
        .phone-hover:hover .phone-icon {
            animation: wiggle 0.5s ease-in-out;
        }

        /* ── Burger lines smooth morph-ready ──────────────── */
        .burger-line {
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
    </style>
</head>

<body class="bg-desert-dark font-sans-luxury antialiased">

    <!-- ═══════════════════════════════════════════════════════
         HEADER — Navigation supérieure premium
         ═══════════════════════════════════════════════════════ -->
    <header
        id="main-header"
        class="header-init animate-header-fade
               sticky top-0 z-50
               w-full h-20 sm:h-24
               bg-black/95 backdrop-blur-sm
               border-b border-gold-400/10"
        role="banner"
    >
        <nav
            class="flex items-center justify-between
                   h-full w-full max-w-7xl mx-auto
                   px-5 sm:px-8 lg:px-12"
            aria-label="Navigation principale"
        >

            <!-- ── BLOC GAUCHE : Bouton Menu Burger ───────── -->
            <div class="flex items-center">
                <button
                    id="menu-burger"
                    type="button"
                    class="group
                           flex items-center justify-center
                           w-11 h-11 sm:w-12 sm:h-12
                           rounded-lg
                           border border-gold-400/40
                           bg-transparent
                           transition-all duration-300 ease-in-out
                           hover:border-gold-400/80
                           hover:bg-white/5
                           hover:shadow-[0_0_15px_rgba(212,164,74,0.08)]
                           focus:outline-none focus:ring-1 focus:ring-gold-400/50"
                    aria-label="Ouvrir le menu de navigation"
                    aria-expanded="false"
                >
                    <!-- Icône Burger — 3 lignes dorées -->
                    <div class="flex flex-col items-center justify-center gap-[5px] w-5 sm:w-[22px]">
                        <span class="burger-line block w-full h-px bg-gold-400 group-hover:bg-gold-300"></span>
                        <span class="burger-line block w-3/4 h-px bg-gold-400 group-hover:bg-gold-300 group-hover:w-full"></span>
                        <span class="burger-line block w-full h-px bg-gold-400 group-hover:bg-gold-300"></span>
                    </div>
                </button>
            </div>


            <!-- ── BLOC CENTRAL : Logo ODEUR DE DUBAÏ ─────── -->
            <a
                id="logo-link"
                href="/"
                class="absolute left-1/2 -translate-x-1/2
                       flex flex-col items-center gap-1 sm:gap-1.5
                       group
                       transition-opacity duration-300
                       hover:opacity-90"
                aria-label="Odeur de Dubaï — Accueil"
            >
                <!-- SVG Logo : Dôme oriental / Goutte de parfum stylisée avec initiales -->
                <svg
                    class="w-8 h-8 sm:w-10 sm:h-10
                           transition-transform duration-500
                           group-hover:scale-105"
                    viewBox="0 0 64 64"
                    fill="none"
                    xmlns="http://www.w3.org/2000/svg"
                    aria-hidden="true"
                >
                    <!-- Dôme oriental stylisé -->
                    <path
                        d="M32 4C32 4 14 22 14 38C14 48 22 56 32 56C42 56 50 48 50 38C50 22 32 4 32 4Z"
                        stroke="url(#logoGoldGradient)"
                        stroke-width="1.5"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        fill="none"
                    />
                    <!-- Dôme intérieur (couche de profondeur) -->
                    <path
                        d="M32 12C32 12 20 26 20 38C20 44.6 25.4 50 32 50C38.6 50 44 44.6 44 38C44 26 32 12 32 12Z"
                        stroke="url(#logoGoldGradient)"
                        stroke-width="0.8"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        fill="none"
                        opacity="0.4"
                    />
                    <!-- Initiale "O" entrelacée -->
                    <text
                        x="32" y="42"
                        text-anchor="middle"
                        font-family="Cormorant Garamond, Georgia, serif"
                        font-size="16"
                        font-weight="300"
                        font-style="italic"
                        fill="url(#logoGoldGradient)"
                    >O</text>
                    <!-- Filet décoratif sous le dôme -->
                    <line
                        x1="22" y1="56" x2="42" y2="56"
                        stroke="url(#logoGoldGradient)"
                        stroke-width="0.8"
                        opacity="0.5"
                    />
                    <!-- Gradient doré réutilisable -->
                    <defs>
                        <linearGradient id="logoGoldGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#f8ecd4" />
                            <stop offset="40%" stop-color="#d4a44a" />
                            <stop offset="100%" stop-color="#c5a055" />
                        </linearGradient>
                    </defs>
                </svg>

                <!-- Texte du logo -->
                <span
                    class="logo-gold-gradient
                           font-serif-luxury
                           text-[11px] sm:text-xs md:text-sm
                           font-semibold
                           tracking-[0.3em] sm:tracking-[0.35em]
                           uppercase
                           leading-none
                           select-none"
                >
                    Odeur de Dubaï
                </span>
            </a>


            <!-- ── BLOC DROIT : Icône Contact (Téléphone) ─── -->
            <div class="flex items-center">
                <a
                    id="contact-phone"
                    href="tel:+33000000000"
                    class="phone-hover
                           group
                           flex items-center justify-center
                           w-11 h-11 sm:w-12 sm:h-12
                           rounded-lg
                           transition-all duration-300 ease-in-out
                           hover:bg-white/5
                           focus:outline-none focus:ring-1 focus:ring-gold-400/50"
                    aria-label="Nous contacter par téléphone"
                >
                    <!-- SVG Téléphone avec ondes sonores -->
                    <svg
                        class="phone-icon w-5 h-5 sm:w-[22px] sm:h-[22px]
                               transition-transform duration-300
                               group-hover:scale-105"
                        viewBox="0 0 28 28"
                        fill="none"
                        xmlns="http://www.w3.org/2000/svg"
                        aria-hidden="true"
                    >
                        <!-- Combiné téléphonique incliné -->
                        <path
                            d="M17.5 16.5L15.8 18.2C15.8 18.2 13.2 16.8 10.7 14.3C8.2 11.8 6.8 9.2 6.8 9.2L8.5 7.5C9.1 6.9 9.2 5.9 8.7 5.2L6.5 2.3C5.9 1.5 4.8 1.3 4 1.9L2.4 3.2C1.5 3.9 1 5 1.1 6.1C1.4 9.5 3.1 14 7.1 18C11.1 22 15.5 23.6 18.9 23.9C20 24 21.1 23.5 21.8 22.6L23.1 21C23.7 20.2 23.5 19.1 22.7 18.5L19.8 16.3C19.1 15.8 18.1 15.9 17.5 16.5Z"
                            stroke="#d4a44a"
                            stroke-width="1.5"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            fill="none"
                        />
                        <!-- Onde sonore 1 (petite) -->
                        <path
                            d="M18 2C19.5 3.5 20.5 5.5 20.5 8"
                            stroke="#d4a44a"
                            stroke-width="1.2"
                            stroke-linecap="round"
                            opacity="0.7"
                        />
                        <!-- Onde sonore 2 (grande) -->
                        <path
                            d="M22 0.5C24 2.5 25.5 5.5 25.5 9"
                            stroke="#d4a44a"
                            stroke-width="1.2"
                            stroke-linecap="round"
                            opacity="0.4"
                        />
                    </svg>
                </a>
            </div>

        </nav>
    </header>
    <!-- ═══ END HEADER ═════════════════════════════════════ -->


    <!-- ═══════════════════════════════════════════════════════
         HERO SECTION — Composition éditoriale fidèle à la référence
         Texte : quadrant supérieur gauche uniquement
         Produit : premier plan bas-droite (dans l'image)
         ═══════════════════════════════════════════════════════ -->
    <section
        id="hero"
        class="relative w-full h-[calc(100vh-5rem)] sm:h-[calc(100vh-6rem)] min-h-[500px] overflow-hidden"
        aria-label="Section héro principale"
    >

        <!-- ── Background Image ───────────────────────────────
             object-[75%_center] sur mobile pour garder le flacon
             et le coucher de soleil visibles.
             object-center sur desktop pour la composition complète.
             ────────────────────────────────────────────────── -->
        <img
            id="hero-bg-image"
            src="assets/images/hero-bg.png"
            alt="Flacon Éclat du Désert posé sur un plateau doré dans le désert de Dubaï au coucher du soleil, avec un brûleur d'encens traditionnel, des dattes et une caravane de chameaux à l'horizon"
            class="absolute inset-0 w-full h-full
                   object-cover
                   object-[75%_center] sm:object-center"
            loading="eager"
            fetchpriority="high"
        >

        <!-- ── Overlay subtil ─────────────────────────────────
             Dégradé très léger : ombre douce en haut-gauche pour
             la lisibilité du texte, quasi-transparent ailleurs
             pour préserver les couleurs chaudes du coucher de soleil.
             ────────────────────────────────────────────────── -->
        <div
            class="absolute inset-0 z-10
                   bg-gradient-to-br
                   from-black/40 via-black/10 to-transparent"
            aria-hidden="true"
        ></div>

        <!-- ── Texte éditorial — Quadrant supérieur gauche ──── -->
        <div class="relative z-20 w-full h-full
                    flex flex-col justify-start
                    px-6 sm:px-10 md:px-14 lg:px-20
                    pt-10 sm:pt-14 md:pt-16 lg:pt-20">

            <div class="max-w-xl lg:max-w-2xl">

                <!-- Titre Principal H1
                     Police Serif Cormorant Garamond, italic, fine
                     Couleur blanc crème lumineux (#faf5eb)
                     Taille fluide : 2.5rem mobile → 4.5rem+ desktop -->
                <h1
                    id="hero-title"
                    class="anim-hidden animate-fade-in-up
                           font-serif-luxury
                           font-light italic
                           text-[2.5rem] sm:text-5xl md:text-6xl lg:text-[4.25rem]
                           leading-[1.08] sm:leading-[1.06]
                           tracking-tight
                           text-[#faf5eb]
                           mb-5 sm:mb-6 md:mb-7"
                >
                    L'essence authentique de&nbsp;Dubaï
                </h1>

                <!-- Description / Paragraphe
                     Même famille Serif (Cormorant Garamond), poids 400
                     Couleur blanc crème légèrement atténuée (#faf5eb/e6 ~90% opacité)
                     Taille inférieure au titre, hauteur de ligne aérée -->
                <p
                    id="hero-description"
                    class="anim-hidden animate-fade-in-up-delay
                           font-serif-luxury
                           font-normal
                           text-lg sm:text-xl md:text-[1.375rem] lg:text-2xl
                           leading-relaxed sm:leading-[1.65]
                           text-[#faf5eb]/90
                           max-w-md lg:max-w-lg"
                >
                    L'or, l'oud et l'excellence réunis dans des
                    créations d'exception. Plus qu'un parfum&nbsp;:
                    une empreinte, un voyage, un&nbsp;art.
                </p>

            </div>

        </div>

    </section>
    <!-- ═══ END HERO SECTION ═══════════════════════════════ -->

</body>
</html>
