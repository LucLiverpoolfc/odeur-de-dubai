<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO Meta Tags -->
    <meta name="description" content="Odeur de Dubaï — L'essence authentique de Dubaï. Découvrez une collection exclusive de haute parfumerie alliant l'or, l'oud et l'excellence.">
    <meta name="keywords" content="parfum, luxe, Dubaï, oud, haute parfumerie, fragrance, collection exclusive">
    <meta name="author" content="Odeur de Dubaï">
    <meta name="theme-color" content="#1a0e04">

    <!-- Open Graph -->
    <meta property="og:title" content="Odeur de Dubaï | Haute Parfumerie">
    <meta property="og:description" content="L'or, l'oud et l'excellence réunis dans des créations d'exception.">
    <meta property="og:type" content="website">

    <title>Odeur de Dubaï | Haute Parfumerie de Luxe</title>

    <!-- Google Fonts: Cormorant Garamond (Serif élégant) + Montserrat (Sans-serif épuré) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Montserrat:wght@200;300;400;500;600&display=swap" rel="stylesheet">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Tailwind Custom Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'serif-luxury': ['"Cormorant Garamond"', 'Georgia', 'serif'],
                        'sans-luxury': ['"Montserrat"', 'system-ui', 'sans-serif'],
                    },
                    colors: {
                        gold: {
                            50:  '#fdf9f0',
                            100: '#f8ecd4',
                            200: '#f0d6a4',
                            300: '#e5bc6e',
                            400: '#d4a44a',
                            500: '#c5a055',
                            600: '#b08a3e',
                            700: '#946e30',
                            800: '#7a5a2c',
                            900: '#654a27',
                        },
                        desert: {
                            dark:    '#1a0e04',
                            deep:    '#2c1a08',
                            warm:    '#3d2810',
                            sand:    '#c2a57b',
                            light:   '#e8d5b7',
                            sunrise: '#e67e22',
                        },
                    },
                    letterSpacing: {
                        'ultra-wide': '0.25em',
                        'luxe':       '0.15em',
                    },
                    animation: {
                        'fade-in-up':       'fadeInUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'fade-in-up-delay': 'fadeInUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards',
                        'fade-in-up-delay2':'fadeInUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.6s forwards',
                        'fade-in-up-delay3':'fadeInUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.9s forwards',
                        'shimmer':          'shimmer 3s ease-in-out infinite',
                        'pulse-glow':       'pulseGlow 4s ease-in-out infinite',
                        'header-fade':      'headerFade 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'wiggle':           'wiggle 0.5s ease-in-out',
                    },
                    keyframes: {
                        fadeInUp: {
                            '0%':   { opacity: '0', transform: 'translateY(40px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        shimmer: {
                            '0%, 100%': { opacity: '0.7' },
                            '50%':     { opacity: '1' },
                        },
                        pulseGlow: {
                            '0%, 100%': { boxShadow: '0 0 20px rgba(197, 160, 85, 0.0)' },
                            '50%':     { boxShadow: '0 0 35px rgba(197, 160, 85, 0.15)' },
                        },
                        headerFade: {
                            '0%':   { opacity: '0', transform: 'translateY(-10px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        wiggle: {
                            '0%, 100%': { transform: 'rotate(0deg)' },
                            '20%':     { transform: 'rotate(-6deg)' },
                            '40%':     { transform: 'rotate(5deg)' },
                            '60%':     { transform: 'rotate(-3deg)' },
                            '80%':     { transform: 'rotate(2deg)' },
                        },
                    },
                },
            },
        }
    </script>

    <!-- Custom Styles (au-delà de Tailwind) -->
    <style>
        /* ── Smooth scroll & base ──────────────────────────── */
        html {
            scroll-behavior: smooth;
        }

        /* ── Initial hidden state for animated elements ───── */
        .anim-hidden {
            opacity: 0;
        }

        /* ── Gold text gradient for the main heading ──────── */
        .text-gold-gradient {
            background: linear-gradient(
                135deg,
                #f8ecd4 0%,
                #d4a44a 30%,
                #e5bc6e 50%,
                #d4a44a 70%,
                #f8ecd4 100%
            );
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* ── Subtle decorative gold line ──────────────────── */
        .gold-line {
            width: 60px;
            height: 1px;
            background: linear-gradient(
                90deg,
                transparent,
                #d4a44a,
                transparent
            );
        }

        /* ── CTA Button — Elegant fill-on-hover effect ───── */
        .cta-luxury {
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(212, 164, 74, 0.6);
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .cta-luxury::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(212, 164, 74, 0.08),
                rgba(212, 164, 74, 0.15),
                rgba(212, 164, 74, 0.08),
                transparent
            );
            transition: left 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .cta-luxury:hover::before {
            left: 100%;
        }

        .cta-luxury:hover {
            border-color: rgba(212, 164, 74, 0.9);
            background-color: rgba(212, 164, 74, 0.1);
            box-shadow:
                0 0 30px rgba(212, 164, 74, 0.12),
                inset 0 0 30px rgba(212, 164, 74, 0.05);
            transform: translateY(-2px);
            letter-spacing: 0.3em;
        }

        /* ── Cursor personnalisé au survol du CTA ─────────── */
        .cta-luxury:hover {
            cursor: pointer;
        }

        /* ── Overlay gradient chaud sur l'image de fond ───── */
        .hero-overlay {
            background: linear-gradient(
                180deg,
                rgba(26, 14, 4, 0.75) 0%,
                rgba(26, 14, 4, 0.40) 35%,
                rgba(26, 14, 4, 0.20) 55%,
                rgba(26, 14, 4, 0.50) 80%,
                rgba(26, 14, 4, 0.85) 100%
            );
        }

        /* ── Fine gold separator ─────────────────────────── */
        .separator-gold {
            width: 80px;
            height: 1px;
            background: linear-gradient(
                90deg,
                transparent 0%,
                #d4a44a 50%,
                transparent 100%
            );
        }

        /* ── Floating particles (decorative) ──────────────── */
        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: rgba(212, 164, 74, 0.4);
            border-radius: 50%;
            animation: floatParticle linear infinite;
        }

        @keyframes floatParticle {
            0% {
                transform: translateY(0) translateX(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) translateX(20px);
                opacity: 0;
            }
        }

        /* ── Logo text gold gradient ──────────────────────── */
        .logo-gold-gradient {
            background: linear-gradient(
                180deg,
                #f8ecd4 0%,
                #d4a44a 40%,
                #c5a055 70%,
                #e5bc6e 100%
            );
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* ── Header entrance animation (initial state) ────── */
        .header-init {
            opacity: 0;
            transform: translateY(-10px);
        }

        /* ── Phone icon wiggle on hover ───────────────────── */
        .phone-hover:hover .phone-icon {
            animation: wiggle 0.5s ease-in-out;
        }

        /* ── Burger lines smooth morph-ready ──────────────── */
        .burger-line {
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
    </style>
</head>

<body class="bg-desert-dark font-sans-luxury antialiased">

    <!-- ═══════════════════════════════════════════════════════
         HEADER — Navigation supérieure ultra-premium
         Fidèle pixel-perfect à la référence "16.59.59.png"
         Structure tri-partite symétrique : Burger | Logo | Téléphone
         ═══════════════════════════════════════════════════════ -->
    <header
        id="main-header"
        class="header-init animate-header-fade
               sticky top-0 z-50
               w-full h-20 sm:h-24
               bg-black"
        role="banner"
    >
        <nav
            class="flex items-center justify-between
                   h-full w-full max-w-7xl mx-auto
                   px-5 sm:px-8 lg:px-12"
            aria-label="Navigation principale"
        >

            <!-- ── BLOC GAUCHE : Bouton Menu Burger ─────────────
                 Conteneur carré, angles généreusement arrondis,
                 fine bordure or champagne 1px,
                 3 lignes identiques parfaitement centrées.
                 ─────────────────────────────────────────────── -->
            <div class="flex items-center">
                <button
                    id="menu-burger"
                    type="button"
                    class="group
                           flex items-center justify-center
                           w-11 h-11 sm:w-[50px] sm:h-[50px]
                           rounded-2xl
                           border border-[#C5A880]/50
                           bg-transparent
                           transition-all duration-300 ease-in-out
                           hover:border-[#C5A880]/90
                           hover:bg-white/[0.03]
                           hover:shadow-[0_0_20px_rgba(197,168,128,0.06)]
                           focus:outline-none focus:ring-1 focus:ring-[#C5A880]/40"
                    aria-label="Ouvrir le menu de navigation"
                    aria-expanded="false"
                >
                    <!-- 3 lignes horizontales — épaisseur identique, largeur identique -->
                    <div class="flex flex-col items-center justify-center gap-[5px] sm:gap-[6px] w-[18px] sm:w-[20px]">
                        <span class="burger-line block w-full h-[1px] bg-[#C5A880] group-hover:bg-[#d4bf9a]"></span>
                        <span class="burger-line block w-full h-[1px] bg-[#C5A880] group-hover:bg-[#d4bf9a]"></span>
                        <span class="burger-line block w-full h-[1px] bg-[#C5A880] group-hover:bg-[#d4bf9a]"></span>
                    </div>
                </button>
            </div>


            <!-- ── BLOC CENTRAL : Emblème Royal + Logo ──────────
                 Emblème SVG complexe : triple arche ogive orientale
                 entrelacée avec initiales O & D, goutte centrale,
                 fleur ciselée à 5 pétales.
                 Texte "ODEUR DE DUBAÏ" en Serif majuscules espacées.
                 ─────────────────────────────────────────────── -->
            <a
                id="logo-link"
                href="/"
                class="absolute left-1/2 -translate-x-1/2
                       flex flex-col items-center gap-1.5 sm:gap-2
                       group
                       transition-opacity duration-300
                       hover:opacity-90"
                aria-label="Odeur de Dubaï — Accueil"
            >
                <!-- Emblème SVG — Motif oriental symétrique complexe -->
                <svg
                    class="w-10 h-10 sm:w-[52px] sm:h-[52px]
                           transition-transform duration-500
                           group-hover:scale-[1.03]"
                    viewBox="0 0 120 80"
                    fill="none"
                    xmlns="http://www.w3.org/2000/svg"
                    aria-hidden="true"
                >
                    <defs>
                        <!-- Gradient doré vertical — référence chromatique exacte -->
                        <linearGradient id="emblemGold" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#d4a44a" />
                            <stop offset="50%" stop-color="#c5a055" />
                            <stop offset="100%" stop-color="#a88a3a" />
                        </linearGradient>
                        <linearGradient id="emblemGoldLight" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#e5c77a" />
                            <stop offset="100%" stop-color="#c5a055" />
                        </linearGradient>
                    </defs>

                    <!-- === ARCHE CENTRALE (ogive / dôme principal) === -->
                    <path
                        d="M60 4 C60 4, 42 20, 42 42 C42 54, 50 62, 60 62 C70 62, 78 54, 78 42 C78 20, 60 4, 60 4Z"
                        stroke="url(#emblemGold)"
                        stroke-width="1.4"
                        stroke-linejoin="round"
                        fill="none"
                    />

                    <!-- === ARCHE GAUCHE (entrelacée — forme O) === -->
                    <path
                        d="M38 18 C38 18, 20 32, 20 48 C20 58, 28 66, 38 66 C48 66, 54 60, 54 52 C54 44, 48 36, 42 30"
                        stroke="url(#emblemGold)"
                        stroke-width="1.4"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        fill="none"
                    />
                    <!-- Boucle basse gauche fermant le "O" -->
                    <path
                        d="M38 66 C30 66, 22 60, 22 50"
                        stroke="url(#emblemGold)"
                        stroke-width="1.2"
                        stroke-linecap="round"
                        fill="none"
                        opacity="0.7"
                    />

                    <!-- === ARCHE DROITE (entrelacée — forme D) === -->
                    <path
                        d="M82 18 C82 18, 100 32, 100 48 C100 58, 92 66, 82 66 C72 66, 66 60, 66 52 C66 44, 72 36, 78 30"
                        stroke="url(#emblemGold)"
                        stroke-width="1.4"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        fill="none"
                    />
                    <!-- Boucle basse droite fermant le "D" -->
                    <path
                        d="M82 66 C90 66, 98 60, 98 50"
                        stroke="url(#emblemGold)"
                        stroke-width="1.2"
                        stroke-linecap="round"
                        fill="none"
                        opacity="0.7"
                    />

                    <!-- === GOUTTE CENTRALE intérieure === -->
                    <path
                        d="M60 16 C60 16, 50 30, 50 42 C50 48, 54 52, 60 52 C66 52, 70 48, 70 42 C70 30, 60 16, 60 16Z"
                        stroke="url(#emblemGoldLight)"
                        stroke-width="0.8"
                        fill="none"
                        opacity="0.5"
                    />

                    <!-- === FLEUR CISELÉE à 5 pétales (bas-centre) === -->
                    <!-- Pétale haut -->
                    <path
                        d="M60 44 C58 40, 62 40, 60 44"
                        fill="url(#emblemGold)"
                        opacity="0.9"
                    />
                    <!-- Pétale droite-haut -->
                    <path
                        d="M60 44 C64 42, 65 46, 60 44"
                        fill="url(#emblemGold)"
                        opacity="0.9"
                    />
                    <!-- Pétale droite-bas -->
                    <path
                        d="M60 44 C64 46, 62 49, 60 44"
                        fill="url(#emblemGold)"
                        opacity="0.9"
                    />
                    <!-- Pétale gauche-bas -->
                    <path
                        d="M60 44 C56 46, 58 49, 60 44"
                        fill="url(#emblemGold)"
                        opacity="0.9"
                    />
                    <!-- Pétale gauche-haut -->
                    <path
                        d="M60 44 C56 42, 55 46, 60 44"
                        fill="url(#emblemGold)"
                        opacity="0.9"
                    />
                    <!-- Centre de la fleur -->
                    <circle cx="60" cy="44" r="1.2" fill="url(#emblemGoldLight)" />

                    <!-- === FILETS DÉCORATIFS (base de l'emblème) === -->
                    <line
                        x1="30" y1="68" x2="90" y2="68"
                        stroke="url(#emblemGold)"
                        stroke-width="0.6"
                        opacity="0.3"
                    />
                </svg>

                <!-- Texte du logo — Serif majuscules, espacement prononcé -->
                <span
                    class="logo-gold-gradient
                           font-serif-luxury
                           text-[10px] sm:text-[11px] md:text-xs
                           font-semibold
                           tracking-[0.18em] sm:tracking-[0.22em]
                           uppercase
                           leading-none
                           select-none
                           whitespace-nowrap"
                >
                    Odeur de Dubaï
                </span>
            </a>


            <!-- ── BLOC DROIT : Icône Contact Téléphonique ──────
                 Combiné filaire incliné vers la droite.
                 Deux arcs concentriques d'ondes sonores en haut-droite.
                 Même couleur champagne #C5A880, traits fins 1.2-1.5px.
                 ─────────────────────────────────────────────── -->
            <div class="flex items-center">
                <a
                    id="contact-phone"
                    href="tel:+33000000000"
                    class="phone-hover
                           group
                           flex items-center justify-center
                           w-11 h-11 sm:w-[50px] sm:h-[50px]
                           rounded-2xl
                           transition-all duration-300 ease-in-out
                           hover:bg-white/[0.03]
                           focus:outline-none focus:ring-1 focus:ring-[#C5A880]/40"
                    aria-label="Nous contacter par téléphone"
                >
                    <svg
                        class="phone-icon w-6 h-6 sm:w-7 sm:h-7
                               transition-transform duration-300
                               group-hover:scale-105"
                        viewBox="0 0 32 32"
                        fill="none"
                        xmlns="http://www.w3.org/2000/svg"
                        aria-hidden="true"
                    >
                        <!-- Combiné téléphonique incliné à droite -->
                        <path
                            d="M19.5 18.5L17.5 20.5C17.5 20.5 14.5 18.8 11.8 16.2C9.2 13.5 7.5 10.5 7.5 10.5L9.5 8.5C10.2 7.8 10.3 6.7 9.7 5.9L7.3 2.8C6.6 1.9 5.4 1.7 4.5 2.3L2.7 3.7C1.7 4.5 1.2 5.7 1.3 6.9C1.6 10.7 3.5 15.5 7.8 19.8C12.1 24.1 17 26 20.7 26.3C21.9 26.4 23.1 25.9 23.9 24.9L25.3 23.2C25.9 22.3 25.7 21.1 24.8 20.5L21.8 18.2C21 17.6 19.9 17.8 19.5 18.5Z"
                            stroke="#C5A880"
                            stroke-width="1.4"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            fill="none"
                        />
                        <!-- Onde sonore 1 (arc intérieur — petite) -->
                        <path
                            d="M20.5 3C22.2 4.7 23.3 7 23.3 9.8"
                            stroke="#C5A880"
                            stroke-width="1.3"
                            stroke-linecap="round"
                            fill="none"
                            opacity="0.8"
                        />
                        <!-- Onde sonore 2 (arc extérieur — grande) -->
                        <path
                            d="M24.5 1C26.8 3.3 28.5 6.5 28.5 10.5"
                            stroke="#C5A880"
                            stroke-width="1.3"
                            stroke-linecap="round"
                            fill="none"
                            opacity="0.5"
                        />
                    </svg>
                </a>
            </div>

        </nav>
    </header>
    <!-- ═══ END HEADER ═════════════════════════════════════ -->


    <!-- ═══════════════════════════════════════════════════════
         HERO SECTION — Composition éditoriale fidèle à la référence
         Texte : quadrant supérieur gauche uniquement
         Produit : premier plan bas-droite (dans l'image)
         ═══════════════════════════════════════════════════════ -->
    <section
        id="hero"
        class="relative w-full h-[calc(100vh-5rem)] sm:h-[calc(100vh-6rem)] min-h-[500px] overflow-hidden"
        aria-label="Section héro principale"
    >

        <!-- ── Background Image ───────────────────────────────
             object-[75%_center] sur mobile pour garder le flacon
             et le coucher de soleil visibles.
             object-center sur desktop pour la composition complète.
             ────────────────────────────────────────────────── -->
        <img
            id="hero-bg-image"
            src="assets/images/hero-bg.png"
            alt="Flacon Éclat du Désert posé sur un plateau doré dans le désert de Dubaï au coucher du soleil, avec un brûleur d'encens traditionnel, des dattes et une caravane de chameaux à l'horizon"
            class="absolute inset-0 w-full h-full
                   object-cover
                   object-[75%_center] sm:object-center"
            loading="eager"
            fetchpriority="high"
        >

        <!-- ── Overlay subtil ─────────────────────────────────
             Dégradé très léger : ombre douce en haut-gauche pour
             la lisibilité du texte, quasi-transparent ailleurs
             pour préserver les couleurs chaudes du coucher de soleil.
             ────────────────────────────────────────────────── -->
        <div
            class="absolute inset-0 z-10
                   bg-gradient-to-br
                   from-black/40 via-black/10 to-transparent"
            aria-hidden="true"
        ></div>

        <!-- ── Texte éditorial — Quadrant supérieur gauche ──── -->
        <div class="relative z-20 w-full h-full
                    flex flex-col justify-start items-center
                    px-6 sm:px-10 md:px-14 lg:px-20
                    pt-10 sm:pt-14 md:pt-16 lg:pt-20">

            <div class="w-full text-center">

                <!-- Titre Principal H1
                     Police Serif Cormorant Garamond, italic, fine
                     Couleur blanc crème lumineux (#faf5eb)
                     Taille fluide : Agrandie -->
                <h1
                    id="hero-title"
                    class="anim-hidden animate-fade-in-up
                           font-serif-luxury
                           font-light italic
                           text-[3.25rem] sm:text-6xl md:text-7xl lg:text-[5.5rem] xl:text-[6.5rem]
                           leading-[1.08] sm:leading-[1.06]
                           tracking-tight
                           text-[#faf5eb]
                           mb-6 sm:mb-8 md:mb-10"
                >
                    L'essence authentique de&nbsp;Dubaï
                </h1>

                <!-- Description / Paragraphe
                     Même famille Serif (Cormorant Garamond), poids 400
                     Couleur blanc crème légèrement atténuée (#faf5eb/e6 ~90% opacité)
                     Taille fluide : Agrandie -->
                <p
                    id="hero-description"
                    class="anim-hidden animate-fade-in-up-delay
                           font-serif-luxury
                           font-normal
                           text-xl sm:text-2xl md:text-[1.625rem] lg:text-[1.875rem] xl:text-3xl
                           leading-relaxed sm:leading-[1.65]
                           text-[#faf5eb]/90
                           max-w-3xl mx-auto"
                >
                    L'or, l'oud et l'excellence réunis dans des
                    créations d'exception. Plus qu'un parfum&nbsp;:
                    une empreinte, un voyage, un&nbsp;art.
                </p>

            </div>

        </div>

    </section>
    <!-- ═══ END HERO SECTION ═══════════════════════════════ -->

</body>
</html>
